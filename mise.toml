[tools]
bun = "1.4.4"
shellcheck = "0.11.0"

[tasks.test]
# jj is set for the tests only: under [tools] it would replace the person's own
# jj in this folder (an old pin there once dropped commit signing on push).
tools = { jj = "latest" }
run = "bun test"

[tasks.check]
description = "herdr-app check on every mod"
run = 'for m in mods/*/; do herdr-app check "$m" || exit 1; done'

[tasks.lint]
run = "shellcheck -s sh install.sh"
